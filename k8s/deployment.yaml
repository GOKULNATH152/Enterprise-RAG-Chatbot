apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-rag

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-rag

  template:
    metadata:
      labels:
        app: enterprise-rag

    spec:
      containers:
      - name: rag

        image: yourdockerhub/enterprise-rag:latest

        ports:
        - containerPort: 8000